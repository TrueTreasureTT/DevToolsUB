<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>DevTools Overlay</title>
  <style>
    body {
      width: 280px;
      padding: 16px;
      margin: 0;
      background: #11151c;
      color: #f5f7fb;
      font-family: system-ui, sans-serif;
    }

    button {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      background: #1b2230;
      color: inherit;
      border: 1px solid #303846;
    }
  </style>
</head>
<body>
  <h2>DevTools Overlay</h2>
  <p>Use on localhost development pages.</p>
  <button id="open">Toggle Overlay</button>
  <p id="status"></p>
  <script src="popup.js"></script>
</body>
</html>
